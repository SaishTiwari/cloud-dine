server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: menu-service
              uri: http://menu-service:8082
              predicates:
                - Path=/api/menu/**
              filters:
                - StripPrefix=1

            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
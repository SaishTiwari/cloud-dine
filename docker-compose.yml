version: "3.8"

services:

  # --------------------
  # POSTGRES DB
  # --------------------
  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - cloudnet
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --------------------
  # AUTH SERVICE
  # --------------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: 8081
    networks:
      - cloudnet

  # --------------------
  # MENU SERVICE
  # --------------------
  menu-service:
    build: ./menu-service
    container_name: menu-service
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: 8082
    networks:
      - cloudnet

  # --------------------
  # ORDER SERVICE
  # --------------------
  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: 8083
    networks:
      - cloudnet

  # --------------------
  # API GATEWAY
  # --------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - menu-service
      - order-service
    networks:
      - cloudnet

# --------------------
# NETWORK
# --------------------
networks:
  cloudnet:
    driver: bridge

# --------------------
# VOLUME
# --------------------
volumes:
  postgres_data: